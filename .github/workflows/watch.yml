name: watch

# Polls Apple for iPhone availability and notifies via Telegram.
# Runs in the cloud so coverage does not depend on a laptop being awake.

on:
  # No schedule: the checker currently runs locally every minute, and a
  # cloud run would keep its own cached state -- duplicate alerts and a
  # second heartbeat message. Re-enable this when local polling stops.
  schedule:
   - cron: '*/5 * * * *'
  workflow_dispatch:

# Never let two checks run at once: they would race on the cached state and
# could double-notify or clobber the heartbeat message id.
concurrency:
  group: watcher
  cancel-in-progress: false

permissions:
  contents: read
  actions: write    # lets a run start the next one (see the last step)

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TZ: America/New_York
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      # state.json carries which parts were already reported and the id of the
      # heartbeat message to edit. Losing it costs a duplicate alert and a new
      # heartbeat -- noisy, never silent.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: watcher-state-${{ github.run_id }}
          restore-keys: watcher-state-

      # Checks every ~55s for up to ~4.5h. If checks keep failing (almost
      # always Apple rate-limiting this machine's IP), it stops early so the
      # last step can move the bot to a fresh machine. The trap makes
      # "Cancel workflow" stop the loop instead of being swallowed.
      - name: Check availability
        run: |
          trap 'exit 130' INT TERM
          fails=0
          for i in $(seq 1 300); do
            if python -m watcher --no-jitter; then fails=0; else fails=$((fails+1)); fi
            if [ "$fails" -ge 6 ]; then
              echo "::warning::6 failed checks in a row; moving to a fresh runner"
              break
            fi
            sleep 50
          done

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: watcher-state-${{ github.run_id }}

      # Start the next run right away (new machine, new IP) instead of waiting
      # on GitHub's schedule, which can lag by an hour. Skipped when the run is
      # cancelled, so cancelling still stops the bot.
      - name: Start the next run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run watch.yml --ref "${{ github.ref_name }}" -R "${{ github.repository }}"
