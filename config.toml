# Shopping list. Star White = branco, Night Sky = preto.

[[watch]]
model = "iPhone Duo"
capacity = "256GB"
colors = ["Star White", "Night Sky"]

[[watch]]
model = "iPhone Duo"
capacity = "512GB"
colors = ["Star White"]

[[watch]]
model = "iPhone Duo"
capacity = "2TB"
colors = ["Star White"]

[[watch]]
model = "iPhone 18 Pro Max"
capacity = "512GB"
colors = ["Burgundy"]

[[watch]]
model = "iPhone 18 Pro Max"
capacity = "1TB"
colors = ["Burgundy"]

[[watch]]
model = "iPhone 18 Pro"
capacity = "512GB"
colors = ["Burgundy"]

[location]
zip = "19702"

# [telegram] chat_id is supplied by the TELEGRAM_CHAT_ID environment
# variable (.env locally, repo secret in CI) so it stays out of this
# public file. You may set it here instead for a private deployment.

[canary]
part = "MJQ34LL/A"

[polling]
jitter_seconds = 15
repeat_minutes = 30
discovery_ttl_hours = 24
failure_alert_threshold = 5
